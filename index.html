<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0ea5c6">
<meta name="description" content="각자 스마트폰으로 함께 하는 거북이 알 낳기 주사위 게임">
<title>Mahe for mobile</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='36' rx='22' ry='16' fill='%2322c55e'/%3E%3Ccircle cx='52' cy='30' r='7' fill='%239fdc7c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body class="portrait">
<div id="loading" class="loading">
  <div class="loading-box">
    <div class="loading-turtle">🐢</div>
    <div class="loading-title">Mahe <span>for mobile</span></div>
    <div class="progress"><div id="progressBar"></div></div>
    <div id="loadingText" class="muted">불러오는 중…</div>
  </div>
</div>

<!-- 첫 화면·대기실·결과 등 HTML 화면 -->
<main id="screen" class="screen" hidden></main>

<!-- 게임 화면: 3D 보드 + 패널 -->
<section id="game" class="game" hidden>
  <div id="board" class="board">
    <div id="noWebgl" class="no-webgl" hidden>
      <p><b>이 기기에서는 3D 그래픽(WebGL)을 쓸 수 없어요.</b><br>최신 Chrome·Safari에서 열어 주세요. 아래 목록으로도 게임은 할 수 있어요.</p>
      <ol id="textBoard"></ol>
    </div>
    <div id="toastBoard" class="board-toast" aria-live="polite"></div>
  </div>
  <aside id="panel" class="panel">
    <header class="topbar">
      <div class="top-left">
        <span id="roomBadge" class="badge"></span>
        <span class="deck" title="남은 알 카드"><span class="egg-ico">🥚</span><b id="deckLeft">20</b>장</span>
        <span id="openCard" class="open-card" title="지금 공개된 알 카드"></span>
      </div>
      <div class="top-right">
        <button id="btnExit" class="exit-btn" aria-label="나가기">나가기</button>
        <button id="btnMenu" class="icon-btn" aria-label="설정">⚙️</button>
      </div>
    </header>
    <div id="turnLine" class="turn-line"></div>
    <div id="timer" class="timer" hidden><div></div></div>
    <div id="diceArea" class="dice-area"></div>
    <div id="actions" class="actions"></div>
    <div id="scores" class="scores"></div>
    <details id="logBox" class="log"><summary>최근 기록</summary><ol id="logList"></ol></details>
  </aside>
  <div id="result" class="result" hidden></div>
</section>

<div id="menu" class="sheet" hidden>
  <div class="sheet-box">
    <h3>설정</h3>
    <label class="row">그래픽 품질
      <select id="selQuality">
        <option value="auto">자동</option><option value="high">높음</option><option value="medium">보통</option><option value="low">낮음</option>
      </select>
    </label>
    <label class="row">효과음 <input type="checkbox" id="chkSound"></label>
    <div id="menuExtra"></div>
    <div class="sheet-actions">
      <button id="btnLeave" class="btn ghost">게임에서 나가기</button>
      <button id="btnCloseMenu" class="btn">닫기</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
